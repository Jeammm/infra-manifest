# MicroK8s 1.35+ uses Traefik in kube-system. If you use Nginx (older MicroK8s):
# use nginx-ingress-microk8s-controller.ingress.svc.cluster.local:80
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare-tunnel
data:
  config.yml: |
    tunnel: jeammm-cluster
    credentials-file: /etc/cloudflared/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: argocd.jeammm.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: whoami.jeammm.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - service: http_status:404
