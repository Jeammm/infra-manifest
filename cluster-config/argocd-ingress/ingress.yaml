# Ingress for ArgoCD server so Cloudflare Tunnel can route argocd.jeammm.com to it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  # MicroK8s 1.35+ uses Traefik; use traefik or public
  ingressClassName: traefik
  rules:
    - host: argocd.jeammm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
