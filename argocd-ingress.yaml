# ArgoCD exposed at https://argocd.jeammm.com via Cloudflare Tunnel.
# Prerequisites (run once) to avoid ERR_TOO_MANY_REDIRECTS:
#   1. Patch server (use args so we don't break the image entrypoint) with --insecure:
#      kubectl edit deployment argocd-server -n argocd
#      Find this and edit:
#       containers:
#         - name: argocd-server
#           image: quay.io/argoproj/argocd:v2.9.3
#           args:
#             - /usr/local/bin/argocd-server
#             - '--insecure'

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: argocd.jeammm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
