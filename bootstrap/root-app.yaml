# App-of-apps: apply once to register this repo as the control plane.
#   kubectl apply -f bootstrap/root-app.yaml
# This Application syncs the "apps/" directory, which contains ArgoCD Application
# manifests. Each of those apps then syncs its own source (this repo or your app repos).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Jeammm/infra-manifest.git
    path: .
    directory:
      recurse: true
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
