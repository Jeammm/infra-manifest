---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-creds
  namespace: cloudflare-tunnel-ingress-controller
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  encryptedData:
    CLOUDFLARE_ACCOUNT_ID: 
    CLOUDFLARE_API_TOKEN: 
    CLOUDFLARE_TUNNEL_NAME: 
  template:
    metadata:
      name: cloudflare-creds
      namespace: cloudflare-tunnel-ingress-controller
