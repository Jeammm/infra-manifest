# SealedSecret for Cloudflare API token and account ID.
# Sealed for this cluster; if you get "API Token must not be empty", re-seal with:
#   kubectl create secret generic cloudflare-creds -n cloudflare-tunnel-ingress-controller \
#     --from-literal=CLOUDFLARE_API_TOKEN=<token> --from-literal=CLOUDFLARE_ACCOUNT_ID=<id> --dry-run=client -o yaml | kubeseal -o yaml
# Sync wave 0 so this is applied before the cloudflare-ingress Application (wave 1).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-creds
  namespace: cloudflare-tunnel-ingress-controller
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  template:
    metadata:
      name: cloudflare-creds
      namespace: cloudflare-tunnel-ingress-controller
  encryptedData:
    CLOUDFLARE_ACCOUNT_ID: 
    CLOUDFLARE_API_TOKEN: 
