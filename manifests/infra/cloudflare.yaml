# Sync wave 1 so the SealedSecret (wave 0) is applied and decrypted first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    chart: cloudflare-tunnel-ingress-controller
    repoURL: https://helm.strrl.dev
    targetRevision: 0.0.22
    helm:
      values: |
        cloudflare:
          tunnelName: "k3s-jeammm"
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare-tunnel-ingress-controller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true