# Example app: whoami (from this repo). For real apps, point repoURL to a separate app repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jeammm/infra-manifest.git
    path: cluster-config/sample-apps/whoami
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
