apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-controller-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jeammm/infra-manifest.git
    path: cluster-config/ingress-controller-service
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
