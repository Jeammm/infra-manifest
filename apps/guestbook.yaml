# Example guestbook from https://github.com/argoproj/argocd-example-apps (plain YAML).
# Ingress from this repo exposes it at guestbook.jeammm.com.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/argoproj/argocd-example-apps.git
      path: guestbook
      targetRevision: master
    - repoURL: https://github.com/Jeammm/infra-manifest.git
      path: manifests/apps/guestbook
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
