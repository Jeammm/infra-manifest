apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: archery-tracker-fe-only
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jeammm/infra-manifest.git
    path: manifests/apps/archery-tracker
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: archery-tracker-fe-only
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
